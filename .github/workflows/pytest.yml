name: etl-tests

on:
  pull_request:
    paths:
      - "etl/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./etl[test]
      - name: Run unit tests
        run: |
          python -m pytest etl/tests/ -m "unit" --maxfail=1 -v
