name: alphamatrix-tests

on:
  pull_request:
    paths: ["python/**", "infra/**", ".github/workflows/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/python[test]
      - name: Run unit tests
        run: |
          pytest -m "unit" --maxfail=1
